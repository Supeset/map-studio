minimumReleaseAgeExclude:
  - '@nuxt/kit@4.4.8'
  - '@nuxt/nitro-server@4.4.8'
  - '@nuxt/schema@4.4.8'
  - '@nuxt/vite-builder@4.4.8'
  - nuxt@4.4.8
  - '@nuxtjs/color-mode@4.0.1'

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'

packages: []

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

catalogs:
  build:
    '@nuxt/devtools': ^3.2.4
    '@nuxt/eslint': ^1.15.2
    '@nuxt/kit': ^4.4.8
    '@nuxtjs/color-mode': ^4.0.1
    '@pinia/nuxt': ^0.11.3
    '@unocss/eslint-config': ^66.7.0
    '@unocss/nuxt': ^66.7.0
    '@vite-pwa/nuxt': ^1.1.1
    '@vueuse/nuxt': ^14.3.0
    nuxt: ^4.4.8
    unocss: ^66.7.0
    unplugin: ^3.0.0
    vite: ^8.0.16
  dev:
    '@antfu/eslint-config': ^9.0.0
    '@types/mapbox__mapbox-gl-draw': ^1.4.9
    astronomy-bundle: ^7.7.7
    dayjs: ^1.11.21
    eslint: ^10.4.1
    eslint-plugin-format: ^2.0.1
    typescript: ^6.0.3
    vue-tsc: ^3.3.4
  frontend:
    '@mapbox/mapbox-gl-draw': ^1.5.1
    '@vueuse/core': ^14.3.0
    gcoord: ^1.0.7
    mapbox-gl: ^3.24.0
    pinia: ^3.0.4
    vue: ^3.5.35
  icons:
    '@iconify-json/carbon': ^1.2.23
    '@iconify-json/gis': ^1.2.5
    '@iconify-json/twemoji': ^1.2.5

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
